name: Oracle Cloud ARM Hunter

on:
  # Запуск за розкладом кожні 30 хвилин (як підстраховка та постійний моніторинг)
  schedule:
    - cron: '*/30 * * * *'
  # Кнопка для ручного запуску з інтерфейсу GitHub Actions
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Запобігає запуску двох однакових процесів одночасно (черга без конфліктів)
concurrency:
  group: oracle-arm-hunter
  cancel-in-progress: false

jobs:
  hunt:
    name: Hunt Free ARM Instance
    runs-on: ubuntu-latest
    timeout-minutes: 350  # Запас до жорсткого ліміту GitHub Actions (360 хв)

    steps:
      - name: Clean up old workflow runs (keep last 3)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Перевірка старих запусків workflow..."
          RUN_IDS=$(gh run list --workflow deploy_arm.yml --repo "$GH_REPO" --status completed --limit 100 --json databaseId --jq '.[3:][].databaseId')
          if [ -z "$RUN_IDS" ]; then
            echo "Старих запусків для видалення немає (зберігаємо 3 останні)."
          else
            for run_id in $RUN_IDS; do
              echo "Видалення старого запуску ID: $run_id"
              gh api -X DELETE "repos/$GH_REPO/actions/runs/$run_id" || true
            done
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup OCI Credentials
        run: |
          mkdir -p ~/.oci
          # Записуємо конфіг та ключ із GitHub Secrets
          echo "${{ secrets.OCI_CONFIG }}" > ~/.oci/config
          echo "${{ secrets.OCI_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Run ARM Hunter
        id: hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMPARTMENT_ID: ${{ secrets.COMPARTMENT_ID }}
          SUBNET_ID: ${{ secrets.SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          MAX_RUN_TIME_MINUTES: "300"  # Працює 5 годин за сесію, потім передає естафету
          HEARTBEAT_MINUTES: "60"      # Звіт у Telegram кожні 60 хвилин
          CHECK_INTERVAL: "60"
          DOMAIN_SWITCH_DELAY: "10"
          OCPUS: ${{ vars.OCPUS || '2' }}
          MEMORY_IN_GBS: ${{ vars.MEMORY_IN_GBS || '12' }}
          OCI_CONFIG_FILE: "/home/runner/.oci/config"
        run: |
          python deploy_arm_actions.py

      - name: Clean up Credentials
        if: always()
        run: |
          rm -rf ~/.oci

      - name: Trigger next run (Continuous 24/7 Loop)
        if: steps.hunter.outputs.instance_created != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
        run: |
          echo "Сервер ще не створено. Запускаємо наступний цикл без очікування (гілка: $GH_REF)..."
          gh workflow run deploy_arm.yml --ref "$GH_REF" -R "$GH_REPO"

